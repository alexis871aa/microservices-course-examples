version: '3'

# Глобальные переменные проекта
vars:
  GO_VERSION: '1.24'
  GOLANGCI_LINT_VERSION: 'v2.3.0'
  GCI_VERSION: 'v0.13.6'
  GOFUMPT_VERSION: 'v0.8.0'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'

tasks:
  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    deps: [ install-formatters ]
    cmds:
      - |
        echo "🧼 Форматируем через gofumpt ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "🎯 Сортируем импорты через gci ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/olezhek28/microservices-course-examples/)" {} +

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    deps: [ install-golangci-lint ]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yml'

  # ===============================
  # DOCKER КОМАНДЫ
  # ===============================

  up:
    desc: "🚀 Запускает полную инфраструктуру (Weather API + Envoy Gateway)"
    cmds:
      - echo "🏗️ Собираем и запускаем инфраструктуру..."
      - docker compose up --build --detach

  down:
    desc: "🛑 Останавливает всю инфраструктуру"
    cmds:
      - echo "🛑 Останавливаем инфраструктуру..."
      - docker compose down
      - echo "✅ Инфраструктура остановлена"

  restart:
    desc: "🔄 Перезапускает инфраструктуру"
    cmds:
      - task: down
      - task: up

  logs:
    desc: "📝 Показывает логи всех сервисов"
    cmds:
      - docker compose logs -f

  logs-envoy:
    desc: "📝 Показывает логи только Envoy"
    cmds:
      - docker compose logs -f envoy

  logs-api:
    desc: "📝 Показывает логи только Weather API"
    cmds:
      - docker compose logs -f weather-api

  health:
    desc: "🏥 Проверяет здоровье всех сервисов"
    cmds:
      - echo "🏥 Проверка здоровья сервисов..."
      - echo ""
      - echo "📊 Envoy Admin (ready check):"
      - curl -f http://localhost:8081/ready || echo "❌ Envoy не готов"
      - echo ""  
      - echo "🌤️ Weather API (через Envoy Gateway):"
      - curl -f http://localhost:8080/api/v1/weather/healthcheck || echo "❌ Weather API недоступен через Gateway"

  test-client:
    desc: "🧪 Запускает тестовый клиент для проверки API"
    deps: [ format ]
    cmds:
      - echo "🧪 Запускаем тестовый клиент..."
      - go run ./cmd/http_client/main.go

  clean:
    desc: "🧹 Очищает Docker ресурсы"
    cmds:
      - echo "🧹 Очищаем Docker ресурсы..."
      - docker compose down --volumes --remove-orphans
      - docker system prune -f
      - echo "✅ Очистка завершена" 