# ===============================
# ENVOY PROXY КОНФИГУРАЦИЯ ДЛЯ HTTP-TO-GRPC TRANSCODING С IAM АУТЕНТИФИКАЦИЕЙ
# ===============================

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8081

static_resources:
  listeners:
  - name: ufo_api_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080

    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ufo_api
          
          # ===============================
          # МАРШРУТИЗАЦИЯ
          # ===============================
          route_config:
            name: ufo_routes
            virtual_hosts:
            - name: ufo_service
              domains: ["*"]
              
              # CORS настройки
              cors:
                allow_origin_string_match:
                - prefix: "*"
                allow_methods: GET, PUT, DELETE, POST, OPTIONS
                allow_headers: keep-alive,user-agent,cache-control,content-type,authorization,session-uuid,x-session-id,cookie
                max_age: "1728000"
                expose_headers: x-user-uuid,x-user-login,x-user-email,x-session-uuid,x-session-expires,grpc-status,grpc-message
              
              routes:
              # API маршруты - требуют аутентификацию
              - match:
                  prefix: "/api/v1/ufo"
                route:
                  cluster: ufo_grpc_cluster
                  timeout: 30s
              
              # Health check эндпоинт - БЕЗ аутентификации
              - match:
                  path: "/health"
                route:
                  cluster: ufo_grpc_cluster
                  timeout: 5s
                # Отключаем авторизацию для health check
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              
              # Fallback маршрут
              - match:
                  prefix: "/"
                direct_response:
                  status: 404
                  body:
                    inline_string: |
                      {
                        "error": "Not Found",
                        "message": "Available endpoints: /api/v1/ufo",
                        "authentication": {
                          "required": true,
                          "methods": [
                            "Header: Session-UUID: <uuid>",
                            "Header: X-Session-ID: <uuid>", 
                            "Header: Authorization: Bearer <uuid>",
                            "Cookie: session_uuid=<uuid>"
                          ],
                          "note": "Any UUID works in this demo (stub implementation)"
                        }
                      }

          # ===============================
          # HTTP ФИЛЬТРЫ (ПОРЯДОК КРИТИЧЕН!)
          # ===============================
          http_filters:
          
          # 1. CORS фильтр - ПЕРВЫЙ
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          
          # 2. ⚠️ EXTERNAL AUTHORIZATION (gRPC) - ВТОРОЙ, ДО transcoder!
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              
              # ⚠️ ИСПОЛЬЗУЕМ gRPC СЕРВИС (IAM напрямую)
              grpc_service:
                envoy_grpc:
                  cluster_name: iam_grpc_cluster
                timeout: 2s  # Таймаут для gRPC вызова
              
              # КРИТИЧНО: Запрещать доступ если auth сервис недоступен
              failure_mode_allow: false
              
              # Включать тело запроса в авторизацию (для POST/PUT)
              with_request_body:
                max_request_bytes: 8192
                allow_partial_message: true
                pack_as_bytes: false
              
              # Передаем метаданные о запросе
              include_peer_certificate: false
              
              # Заголовки, которые отправляем в auth service
              allowed_headers:
                patterns:
                  - exact: "authorization"     # Bearer token
                  - exact: "cookie"           # Session cookies
                  - exact: "session-uuid"     # Кастомный заголовок
                  - exact: "x-session-id"     # Альтернативный заголовок
                  - exact: "user-agent"       # Для аналитики
                  - exact: "x-forwarded-for"  # IP адрес клиента
                  - exact: "x-real-ip"        # Реальный IP
                  - exact: "host"             # Хост
          
          # 3. gRPC JSON Transcoder - ТРЕТИЙ, после авторизации
          - name: envoy.filters.http.grpc_json_transcoder
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
              proto_descriptor: "/etc/envoy/ufo_descriptor.pb"
              services: ["ufo.v1.UFOService"]
              match_incoming_request_route: true
              print_options:
                add_whitespace: true
                always_print_primitive_fields: true
                always_print_enums_as_ints: false
                preserve_proto_field_names: true
              ignore_unknown_query_parameters: true
          
          # 4. Router фильтр - ОБЯЗАТЕЛЬНО ПОСЛЕДНИЙ
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ===============================
  # CLUSTERS
  # ===============================
  clusters:
  
  # UFO gRPC Service Cluster
  - name: ufo_grpc_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    
    # HTTP/2 для gRPC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    
    # Circuit breaker для UFO сервиса - защита от перегрузки
    circuit_breakers:
      thresholds:                      # Пороговые значения для circuit breaker
      - priority: DEFAULT              # Приоритет трафика (DEFAULT, HIGH)
        max_connections: 50            # Максимум одновременных TCP соединений к upstream
        max_pending_requests: 100      # Максимум запросов в очереди ожидания
        max_requests: 1000            # Максимум активных HTTP запросов одновременно
        max_retries: 3                # Максимум одновременных retry попыток
    
    # Health checking для UFO сервиса
    health_checks:
    - timeout: 3s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2
      grpc_health_check:
        service_name: "ufo.v1.UFOService"
    
    # Endpoint UFO gRPC сервиса
    load_assignment:
      cluster_name: ufo_grpc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ufo-grpc-server  # Docker service name
                port_value: 50051         # gRPC порт UFO сервиса

  # ⚠️ IAM gRPC Service Cluster (для External Authorization)
  - name: iam_grpc_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    
    # HTTP/2 обязательно для gRPC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            # Настройки HTTP/2 для оптимальной производительности
            max_concurrent_streams: 100
            initial_stream_window_size: 65536
            initial_connection_window_size: 1048576
    
    # Connection pooling для производительности
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 10          # Ограничиваем количество соединений
        max_pending_requests: 50     # Очередь запросов
        max_requests: 100           # Максимальные активные запросы
        max_retries: 3              # Максимальные retry попытки
        track_remaining: true
    
    # Настройки соединений
    upstream_connection_options:
      tcp_keepalive:
        keepalive_probes: 3
        keepalive_time: 30
        keepalive_interval: 5
    
    # Health checking для IAM сервиса
    health_checks:
    - timeout: 1s
      interval: 5s
      unhealthy_threshold: 2
      healthy_threshold: 2
      grpc_health_check:
        service_name: "iam.v1.IAMService"
    
    # Endpoint IAM gRPC сервиса
    load_assignment:
      cluster_name: iam_grpc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: iam-grpc-server  # Docker service name
                port_value: 50052         # gRPC порт IAM сервиса

# ===============================
# ДЕТАЛЬНЫЙ ПОТОК ОБРАБОТКИ ЗАПРОСА С АУТЕНТИФИКАЦИЕЙ:
# ===============================
# 1. HTTP клиент → Envoy:8080/api/v1/ufo (с кукой Session-UUID)
# 2. HTTP Connection Manager парсит запрос
# 3. CORS фильтр добавляет CORS заголовки
# 4. ext_authz фильтр:
#    a) Извлекает session-uuid из заголовков/cookies
#    b) Отправляет gRPC CheckRequest в iam-grpc-server:50052
#    c) IAM сервис обрабатывает Check() -> извлекает session_uuid -> вызывает Whoami()
#    d) Возвращает CheckResponse с заголовками x-user-* и x-session-*
#    e) Envoy добавляет эти заголовки в запрос к UFO сервису
# 5. gRPC JSON Transcoder преобразует HTTP → gRPC
# 6. Router направляет запрос в ufo-grpc-server:50051 (с заголовками пользователя)
# 7. UFO сервис получает запрос с информацией о пользователе в заголовках
# 8. Обратный поток: gRPC ответ → JSON → HTTP клиент

# ===============================
# ВАЖНЫЕ ОСОБЕННОСТИ КОНФИГУРАЦИИ:
# ===============================
# 1. ext_authz фильтр ДОЛЖЕН быть ДО grpc_json_transcoder
# 2. IAM сервис реализует ОБА интерфейса: Whoami + Check (External Authorization)
# 3. failure_mode_allow: false для безопасности (deny by default)
# 4. HTTP/2 обязательно для всех gRPC кластеров
# 5. Health checks для всех сервисов
# 6. Circuit breakers для защиты от перегрузок
# 7. /health эндпоинт исключен из аутентификации
# 8. Поддержка 4 способов передачи session_uuid:
#    - Session-UUID заголовок
#    - X-Session-ID заголовок  
#    - Authorization Bearer токен
#    - session_uuid cookie