# OpenTelemetry Collector конфигурация для note-service
# Коллектор служит посредником между приложением и системой мониторинга
# Принимает телеметрию от приложений, обрабатывает и отправляет в хранилища

# RECEIVERS - компоненты для приема телеметрии
# Определяют протоколы и эндпоинты для получения данных от приложений
receivers:
  # OTLP (OpenTelemetry Protocol) receiver - стандартный протокол OpenTelemetry
  # Принимает метрики, трейсы и логи от приложений с помощью gRPC или HTTP
  otlp:
    protocols:
      grpc:
        # Слушаем на всех интерфейсах на порту 4317 (стандартный порт для OTLP gRPC)
        endpoint: 0.0.0.0:4317

# PROCESSORS - компоненты для обработки и трансформации телеметрии
# Выполняют фильтрацию, группировку, обогащение данных перед экспортом
processors:
  # Batch processor - группирует метрики в пакеты для эффективной отправки
  # Снижает нагрузку на сеть и системы назначения
  batch:
    send_batch_size: 1000      # Размер пакета (количество элементов)
    timeout: 10s               # Максимальное время ожидания перед отправкой
    send_batch_max_size: 1000  # Максимальный размер пакета

# EXPORTERS - компоненты для отправки обработанной телеметрии в системы назначения
# Определяют куда и в каком формате отправлять данные
exporters:
  # Prometheus Remote Write exporter - отправляет метрики в Prometheus
  # Использует Remote Write API для записи метрик в Prometheus
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write

# SERVICE - основная конфигурация сервиса коллектора
service:
  # Telemetry - настройки телеметрии самого коллектора
  # Позволяет мониторить работу коллектора (сколько данных обработано, ошибки и т.д.)
  telemetry:
    metrics:
      # Эндпоинт для метрик самого коллектора (можно скрейпить Prometheus-ом)
      address: 0.0.0.0:8888
  
  # PIPELINES - определяют поток обработки данных
  # Связывают receivers -> processors -> exporters в цепочку обработки
  pipelines:
    metrics:
      # Источники метрик
      receivers: [otlp]
      # Обработчики (применяются в указанном порядке)
      processors: [batch]
      # Назначения для экспорта
      exporters: [prometheusremotewrite]